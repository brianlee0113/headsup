<text x="484" y="166" fill="#0A0A0A" xml:space="preserve"><tspan>  This summer I interned on </tspan><tspan fill="#E0186C" font-weight="700" text-decoration="underline">the payments</tspan></text>
<text x="484" y="188" fill="#0A0A0A" xml:space="preserve"><tspan>  </tspan><tspan fill="#E0186C" font-weight="700" text-decoration="underline">team at Northwind</tspan><tspan>, where I </tspan><tspan fill="#E0186C" font-weight="700" text-decoration="underline">shipped payout</tspan></text>
<text x="484" y="210" fill="#0A0A0A" xml:space="preserve"><tspan>  </tspan><tspan fill="#E0186C" font-weight="700" text-decoration="underline">retries that cut failed payouts by 30%</tspan><tspan>.</tspan></text>
<text x="484" y="232" fill="#0A0A0A" xml:space="preserve"><tspan>  On the side I built </tspan><tspan fill="#E0186C" font-weight="700" text-decoration="underline">Quorum, a web app that</tspan></text>
<text x="484" y="254" fill="#0A0A0A" xml:space="preserve"><tspan>  </tspan><tspan fill="#E0186C" font-weight="700" text-decoration="underline">finds a meeting time for student clubs</tspan></text>
<text x="484" y="276" fill="#0A0A0A" xml:space="preserve"><tspan>  </tspan><tspan fill="#E0186C" font-weight="700" text-decoration="underline">from everyone’s calendar</tspan><tspan>. ...</tspan></text>
