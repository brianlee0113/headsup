<text x="484" y="92" fill="#6B6B6B"><tspan fill="#E0186C" font-weight="700">⌃ heads-up</tspan> · 3 notes from Claude Code</text>
<text x="484" y="122" fill="#0A0A0A" xml:space="preserve"><tspan>● Dear hiring team,</tspan></text>
